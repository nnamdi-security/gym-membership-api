<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>FitPro Login Demo</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="w-full max-w-md bg-white rounded-2xl shadow p-6">
        <h1 class="text-2xl font-bold mb-2">
            FitPro Login
        </h1>

        <p class="text-sm text-gray-500 mb-6">
            Simple frontend calling the FastAPI backend.
        </p>

        <form id="loginForm" class="space-y-4">
            <div>
                <label
                    for="email"
                    class="block text-sm font-medium mb-1"
                >
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    value="member@fitpro.demo"
                    class="w-full border rounded-lg px-3 py-2"
                    required
                />
            </div>

            <div>
                <label
                    for="password"
                    class="block text-sm font-medium mb-1"
                >
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    value="FitProDemo123!"
                    class="w-full border rounded-lg px-3 py-2"
                    required
                />
            </div>

            <button
                type="submit"
                class="w-full bg-black text-white rounded-lg py-2"
            >
                Login
            </button>
        </form>

        <div
            id="result"
            class="mt-5 text-sm whitespace-pre-wrap"
        ></div>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            result.textContent = "Logging in...";

            try {
                const response = await fetch(
                    "http://localhost:8000/api/v1/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    result.textContent =
                        "Login failed:\n" +
                        JSON.stringify(data, null, 2);

                    return;
                }

                localStorage.setItem(
                    "fitpro_token",
                    data.access_token
                );

                result.textContent =
                    "Login successful!\n\n" +
                    "Token saved in localStorage.";
            } catch (error) {
                result.textContent =
                    "Could not connect to backend.\n" +
                    error.message;
            }
        });
    </script>

</body>
</html>
