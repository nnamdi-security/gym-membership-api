name: CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitpro
          POSTGRES_PASSWORD: fitpro
          POSTGRES_DB: fitpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitpro -d fitpro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://fitpro:fitpro@localhost:5432/fitpro
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key
      DAILY_JOB_API_KEY: test-api-key
      WEBHOOK_SECRET: test-webhook-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest
      

        